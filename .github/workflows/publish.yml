name: publish
on:
  schedule: [{ cron: '7,37 * * * *' }]
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ahmedmatwe/kader-kora-data, token: '${{ secrets.MEDIA_TOKEN }}', path: .data }
      - name: ربط البيانات الخاصة
        run: ln -sfn .data/data data && ln -sfn .data/queue queue && ln -sfn .data/videos videos && mkdir -p .data/logs
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: نشر اللي عليه الدور
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          L=.data/logs/publish-${{ github.run_id }}.txt
          set +e; node scripts/cloud-publish.mjs > "$L" 2>&1; rc=$?; set -e
          grep -E '^== ' "$L" | tail -1 || true
          echo "السجل الكامل في الريبو الخاص (logs/publish-${{ github.run_id }}.txt) · exit $rc"; exit $rc
      - name: حفظ حالة الطابور والسجل
        if: always()
        run: |
          cd .data; git config user.name "kader-kora-bot"; git config user.email "bot@users.noreply.github.com"
          ls -t logs/* 2>/dev/null | tail -n +600 | xargs rm -f
          git add -A; git diff --cached --quiet || git commit -qm "نشر: تحديث الطابور"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
      - name: استدعاء فريق الإصلاح (لو الدورة وقعت)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run repair.yml -R ${{ github.repository }} -f run_id=${{ github.run_id }} -f wf=publish
