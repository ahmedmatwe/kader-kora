name: repair
# فريق الإصلاح الدائم في السحابة (Gemini بمفاتيح كادر كورة — من غير الماك ومن غير اشتراك Claude).
# أول ما أي دورة تقع: يقرا السجل + كتاب الخبرة (REPAIR_PLAYBOOK.md)، يصلّح، يفحص، مراجع مستقل يوافق، وبعدين يرفع ويشغّل المصنع تاني.
on:
  workflow_run: { workflows: [factory, publish, comments, stats], types: [completed] }
  workflow_dispatch: { inputs: { run_id: { description: 'رقم الدورة اللي وقعت', required: true } } }
permissions: { contents: write, actions: write }
concurrency: { group: repair, cancel-in-progress: false }
jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      WF: ${{ github.event.workflow_run.name || 'factory' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: أدوات الفحص
        run: cd motion && npm install --no-audit --no-fund --loglevel=error
      - name: سجل الدورة اللي وقعت
        run: |
          [ -n "$RUN_SHA" ] || echo "RUN_SHA=$(gh run view "$RUN_ID" --json headSha -q .headSha)" >> $GITHUB_ENV
          gh run view "$RUN_ID" --log-failed > /tmp/failed.log 2>/dev/null || gh run view "$RUN_ID" --log | tail -400 > /tmp/failed.log || true
      - name: فريق الإصلاح
        run: node scripts/auto/repair.mjs /tmp/failed.log "$WF"
      - name: رفع الإصلاح + تشغيل المصنع تاني
        run: |
          S=$(node -e "console.log(require('/tmp/repair.json').status)")
          git config user.name "kader-repair"; git config user.email "repair@users.noreply.github.com"
          git add data/repairs.json $(node -e "console.log((require('/tmp/repair.json').files||[]).join(' '))")
          git diff --cached --quiet || (git commit -qm "فريق الإصلاح: $(node -e "console.log(require('/tmp/repair.json').message.split('\n')[0].slice(0,80))")" && git pull -q --rebase && git push -q)
          if [ "$S" = fixed ] && [ "$WF" = factory ]; then gh workflow run factory.yml; fi
      - name: بلّغ صاحب القناة
        if: always()
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f /tmp/repair.json ] || echo '{"status":"failed","message":"فريق الإصلاح نفسه وقع"}' > /tmp/repair.json
          MSG=$(node -e "const r=require('/tmp/repair.json');const h={fixed:'🛠️ فريق الإصلاح صلّح غلطة',external:'🌐 وقعة من برّه (كوتة/شبكة) — المصنع هيكمّل لوحده',diagnosed:'🔍 فريق الإصلاح شخّص الغلطة',failed:'⚠️ فريق الإصلاح ما قدرش يصلّح بأمان',['gave-up']:'🆘 غلطة اتكررت — محتاجة تدخل',skip:'ℹ️ فريق الإصلاح'}[r.status]||r.status;console.log(h+' في «'+process.env.WF+'»:\n'+r.message)")
          [ -n "$T" ] && curl -s -o /dev/null "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$C" --data-urlencode "text=$MSG" || true
