name: comments
on:
  schedule: [{ cron: '23 * * * *' }]   # كل ساعة
  workflow_dispatch:
concurrency: { group: comments, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ahmedmatwe/kader-kora-data, token: '${{ secrets.MEDIA_TOKEN }}', path: .data }
      - name: ربط البيانات الخاصة
        run: ln -sfn .data/data data && ln -sfn .data/queue queue && ln -sfn .data/videos videos && mkdir -p .data/logs
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: الرد على الكومنتات
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          L=.data/logs/comments-${{ github.run_id }}.txt
          set +e; node scripts/comments.mjs > "$L" 2>&1; rc=$?; set -e
          grep -E '^== ' "$L" | tail -1 || true
          echo "السجل الكامل في الريبو الخاص (logs/comments-${{ github.run_id }}.txt) · exit $rc"; exit $rc
      - if: always()
        run: |
          cd .data; git config user.name "kader-kora-bot"; git config user.email "bot@users.noreply.github.com"
          ls -t logs/* 2>/dev/null | tail -n +120 | xargs rm -f
          git add -A; git diff --cached --quiet || git commit -qm "ردود الكومنتات"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
