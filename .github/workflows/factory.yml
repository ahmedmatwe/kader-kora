name: factory
# المصنع: كل ساعة دورة = فيديو واحد (لحد الحد اليومي في data/config.json). شغال 24 ساعة من غير الماك.
on:
  schedule: [{ cron: '*/20 * * * *' }]
  workflow_dispatch:
concurrency: { group: factory, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ahmedmatwe/kader-kora-data, token: '${{ secrets.MEDIA_TOKEN }}', path: .data }
      - name: ربط البيانات الخاصة
        run: ln -sfn .data/data data && ln -sfn .data/queue queue && ln -sfn .data/videos videos && mkdir -p .data/logs
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: motion/package.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/auto/requirements.txt }
      - name: أدوات (ffmpeg + faster-whisper + Remotion)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q -r scripts/auto/requirements.txt
          cd motion && npm install --no-audit --no-fund --loglevel=error && npx remotion browser ensure
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-large-v3-turbo }
      - name: دورة إنتاج
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          RENDER_CONCURRENCY: '100%'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
          WHISPER_MODEL: large-v3-turbo
          DATA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          L=.data/logs/factory-${{ github.run_id }}.txt
          set +e; node scripts/auto/factory.mjs > "$L" 2>&1; rc=$?; set -e
          grep -E '^== ' "$L" | tail -1 || true
          echo "السجل الكامل في الريبو الخاص (logs/factory-${{ github.run_id }}.txt) · exit $rc"; exit $rc
      - name: حفظ (الطابور + السجل + ملفات الفيديو النصية)
        if: always()
        run: |
          cd .data; git config user.name "kader-kora-bot"; git config user.email "bot@users.noreply.github.com"
          ls -t logs/* 2>/dev/null | tail -n +120 | xargs rm -f
          git add -A; git diff --cached --quiet || git commit -qm "المصنع: دورة إنتاج"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
      - name: نشر مباشر (لو اتعمل فيديو)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          S=$(node -e "const f=require('fs').existsSync('data/factory.json')?require('./data/factory.json'):{runs:[]};console.log((f.runs.at(-1)||{}).status||'')")
          if [ "$S" = queued ]; then gh workflow run publish.yml; fi
      - name: الدورة الجاية على طول (ما بنقفش غير عند الحد اليومي)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          M=$(node -e "const c=require('./data/config.json');const f=require('fs').existsSync('data/factory.json')?require('./data/factory.json'):{runs:[]};const cd=(x)=>new Date(x).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});const d=cd(Date.now());const n=f.runs.filter(r=>r.status==='queued'&&cd(r.at)===d).length;const last=f.runs.at(-1)||{};console.log(!c.enabled||n>=c.dailyTarget?'stop':last.status==='spacing'?'space:'+Math.min(30,last.waitMin||10):['llm-quota','tts-quota','no-story'].includes(last.status)?'wait':'go')")
          echo "الحالة: $M"
          if [ "$M" = stop ]; then echo "وصلنا الحد اليومي — الكرون هيبدأ بكرة"; exit 0; fi
          if [ "$M" = wait ]; then echo "كوتة/مفيش أخبار — نستنى 10 دقايق ونرجع"; sleep 600; fi
          case "$M" in space:*) echo "ساعة بين كل فيديو — نستنى ${M#space:} دقيقة"; sleep $(( ${M#space:} * 60 ));; esac
          gh workflow run factory.yml
