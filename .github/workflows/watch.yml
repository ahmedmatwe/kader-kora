name: watch
# 🛡️ فريق متابعة النفي لحظة بلحظة: جولة كل 3 دقايق، 50 دقيقة، وبعدين يشغّل نفسه تاني (والكرون احتياطي) يراجع أخبارنا آخر 3 أيام. خبر اتنفى → يلغي اللي ما نزلش + فيديو نفي على طول.
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
concurrency: { group: watch, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: متابعة النفي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LOOP_MIN: '50'
        run: |
          git config user.name "kader-watch"; git config user.email "watch@users.noreply.github.com"
          node scripts/auto/watch.mjs
      - name: حفظ + تشغيل فيديو النفي
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "kader-watch"; git config user.email "watch@users.noreply.github.com"
          git add queue data || true
          git diff --cached --quiet || git commit -qm "متابعة النفي"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
          if [ "$(cat /tmp/watch-dispatch 2>/dev/null)" = yes ]; then gh workflow run factory.yml; fi
          gh workflow run watch.yml  # ما بيقفش: الدورة الجاية على طول
